name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: stockpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://stockpilot:ci_password@localhost:5432/stockpilot_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets:selftest
      - run: npm run scan:secrets
      # Fails on high or critical vulnerabilities in production dependencies.
      # If it fails: read the advisory, fix or upgrade, and record any accepted risk in docs/SECURITY_REVIEW.md.
      - run: npm run audit:deps
